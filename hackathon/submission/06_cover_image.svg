<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ReleaseLens: Evidence-backed release verification</title>
  <desc id="desc">A title cover showing a change moving through impact, verification, findings, evidence, and a release dossier.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#26313c" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#fade)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.28"/>
  <rect x="128" y="126" width="10" height="236" rx="5" fill="#f97316"/>
  <text x="176" y="180" fill="#facc15" font-family="Aptos, Segoe UI, sans-serif" font-size="27" font-weight="700" letter-spacing="2">IBM BOB 2.0 HACKATHON</text>
  <text x="168" y="306" fill="#f4f6f8" font-family="Aptos Display, Segoe UI, sans-serif" font-size="108" font-weight="700">ReleaseLens</text>
  <text x="174" y="382" fill="#b7c1ca" font-family="Aptos, Segoe UI, sans-serif" font-size="38">Evidence-backed release verification</text>
  <text x="174" y="450" fill="#8795a3" font-family="Aptos, Segoe UI, sans-serif" font-size="25">A local-first workflow for understanding change, checks, and evidence.</text>

  <g transform="translate(172 650)">
    <g fill="#131b23" stroke="#34414d" stroke-width="2">
      <rect x="0" y="0" width="238" height="128" rx="8"/>
      <rect x="280" y="0" width="238" height="128" rx="8"/>
      <rect x="560" y="0" width="238" height="128" rx="8"/>
      <rect x="840" y="0" width="238" height="128" rx="8"/>
      <rect x="1120" y="0" width="238" height="128" rx="8"/>
    </g>
    <g font-family="Aptos, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#f4f6f8">
      <text x="28" y="72">CHANGE</text>
      <text x="308" y="72">IMPACT</text>
      <text x="588" y="72">VERIFICATION</text>
      <text x="868" y="72">EVIDENCE</text>
      <text x="1148" y="72">DOSSIER</text>
    </g>
    <g fill="#f97316">
      <circle cx="32" cy="104" r="5"/><circle cx="312" cy="104" r="5"/>
      <circle cx="592" cy="104" r="5"/><circle cx="872" cy="104" r="5"/>
      <circle cx="1152" cy="104" r="5"/>
    </g>
    <g stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M247 64h22m-8-8 8 8-8 8"/>
      <path d="M527 64h22m-8-8 8 8-8 8"/>
      <path d="M807 64h22m-8-8 8 8-8 8"/>
      <path d="M1087 64h22m-8-8 8 8-8 8"/>
    </g>
  </g>

  <line x1="128" y1="944" x2="1792" y2="944" stroke="#34414d" stroke-width="2"/>
  <text x="132" y="996" fill="#8795a3" font-family="Aptos, Segoe UI, sans-serif" font-size="22">LOCAL-FIRST PROTOTYPE</text>
  <text x="1788" y="996" fill="#8795a3" font-family="Aptos, Segoe UI, sans-serif" font-size="22" text-anchor="end">Evidence over assertion</text>
</svg>